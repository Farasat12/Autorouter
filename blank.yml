name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build Debug and Release APK
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/AutoRouter-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/AutoRouter-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoRouter-APKs
          path: out/*.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Auto Router Build #${{ github.run_number }}
          files: out/*.apk
